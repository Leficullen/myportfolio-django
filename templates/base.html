{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{name}} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/x-icon" href="/static/img/lefi-hengker.png">
    {% block meta %} {% endblock meta %}
</head>

<body>
    <header class="site-header">
        <div class="container">
             <nav>
                <div class="nav-item">
                     <a href="{% url 'main:show_main'%}#hero" class="brand nav-link"><i data-lucide="home"></i> <span>Home</span> </a>
                </div>
                  <div class="nav-item">
                     <a href="{% url 'main:show_main'%}#profile" class="brand nav-link"><i data-lucide="id-card"></i><span>Profile</span> </a>
                </div>
                  <div class="nav-item">
                     <a href="{% url 'main:show_projects'%}" class="brand nav-link"><i data-lucide="code"></i><span>Projects</span></a>
                </div>
                  <div class="nav-item">
                     <a href="{% url 'main:show_experience'%}" class="brand nav-link"><i data-lucide="briefcase-business"></i> <span>Experience</span></a>
                </div>
            </nav>
        </div>
    </header>

    {% block content %} {% endblock content %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script>
        const calendarRoot = document.querySelector("#github-calendar-root");

        function renderGithubCalendar(calendar) {
            const months = calendar.months.map((month) => {
                return `<span style="grid-column: span ${month.totalWeeks};">${month.name}</span>`;
            }).join("");

            const weeks = calendar.weeks.map((week) => {
                const days = week.contributionDays.map((day) => {
                    return `<span class="calendar-day" style="background-color: ${day.color}" title="${day.contributionCount} contributions on ${day.date}"></span>`;
                }).join("");

                return `<div class="calendar-week">${days}</div>`;
            }).join("");

             const colors = calendar.colors.map((color) => {
                return `<span class="legend-day" style="background-color: ${color}"></span>`;
            }).join("");

          calendarRoot.innerHTML = `
              <div class="calendar-board">
                  <div class="calendar-months">${months}</div>
                  <div class="calendar-grid">${weeks}</div>
                  <div class="calendar-footer">
                      <div class="calendar-legend">
                          <span>Less</span>
                          ${colors}
                          <span>More</span>
                      </div>
                      <p>${calendar.totalContributions} contributions in the last year</p>

                  </div>
              </div>
          `;

        }

        setTimeout(async () => {
            try {
                const response = await fetch("{% url 'main:github_contributions_api' %}");

                if (!response.ok) {
                    throw new Error("Failed to fetch Github Contributions");
                }

                const calendar = await response.json();
                renderGithubCalendar(calendar);
            } catch (error) {
                calendarRoot.innerHTML = `<p class="calendar-empty">GitHub contribution data is unavailable.</p>`;
            }
        }, 500)
    </script>
</body>

</html>

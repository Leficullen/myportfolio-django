<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - "{{name}}"</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
     <link rel="icon" type="image/x-icon" href="/static/img/lefi-hengker.png">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main'%}" class="brand">Lefi</a>
             <nav>
                <a href="{% url 'main:show_main'%}#profile">Profile</a>
                <a href="{% url 'main:show_projects'%}">Projects</a>
                <a href="{% url 'main:show_experience'%}">Experience</a>
            </nav>
        </div>
    </header>

    <main>
          <div class="container">
               <section class="projects" id="projects">
            <div class="container">
                <h1>Deep Dive into my Projects</h1>
                <div class="project-container">
                    {% for project in project_list %}
                         <div class="project-card">
                         <img class="project-img" src="{{project.image}}" alt="Photo of {{project.title}}"/>
                         <div class="project-desc">
                              <h3>{{project.title}}</h3>
                              <p>{{project.description}}</p>
                              <a href="{{project.url_link}}" target="_blank"> <button class="button">Visit →</button></a>
                         </div>
                         </div>
                    {% endfor %}
                </div>
            </div>
        </section>
          </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 "{{ name }}". Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>

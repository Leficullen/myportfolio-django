{% extends 'base.html' %}
{% block content %}

<main>
        <div class="container">
            <section class="projects" id="projects">
        <div class="container">
            <h1>Deep Dive into my Projects</h1>
            <div class="project-container">
                {% for project in project_list %}
                        <div class="project-card">
                        <img class="project-img" src="{{project.image}}" alt="Photo of {{project.title}}"/>
                        <div class="project-desc">
                            <h3>{{project.title}}</h3>
                            <p>{{project.description}}</p>
                            <a href="{{project.url_link}}" target="_blank" class="btn btn-primary">Visit →</a>
                        </div>
                        </div>
                {% empty %}
                        <p class="empty-state">
                            Belum ada proyek yang ditambahkan.
                        </p>
                {% endfor %}
            </div>
        </div>
    </section>
</main>
{% endblock content %}
